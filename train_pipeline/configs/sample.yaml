model:
  name: "unsloth/Qwen2.5-VL-3B-Instruct"
  max_seq_length: 4096
  load_in_4bit: true

lora:
  r: 16
  lora_alpha: 32
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  use_gradient_checkpointing: "unsloth"
  random_state: 3407

dataset:
  scene_analysis: "data/scene_analysis.jsonl"
  cut_analysis: "data/cut_analysis.jsonl"
  scenario_analysis: "data/scenario_analysis.jsonl"

training:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  max_steps: 1000
  learning_rate: 2.0e-4
  warmup_steps: 50
  output_dir: "outputs"
  fp16: false
  bf16: true
  logging_steps: 10
  save_steps: 250
  report_to: "none"

output:
  save_merged: true
  save_dir: "models/qwen_vl_ad"
